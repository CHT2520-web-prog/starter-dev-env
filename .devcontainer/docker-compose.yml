services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VARIANT: 8.3-bookworm
    volumes:
      # Mounts the parent of the repo folder, as the Dev Containers PHP templates do
      - ../..:/workspaces:cached
    # Keep the container running so VS Code / Codespaces can attach to it
    command: sleep infinity
    # Share the db container's network so the app reaches MariaDB on 127.0.0.1:3306
    network_mode: service:db

  db:
    image: mariadb:11.4
    restart: unless-stopped
    volumes:
      - mariadb-data:/var/lib/mysql
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: app
      MARIADB_USER: app
      MARIADB_PASSWORD: app

volumes:
  mariadb-data:
